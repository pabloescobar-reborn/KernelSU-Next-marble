name: Build Marble Kernel

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "Clang LTO mode"
        type: choice
        default: thin
        options: [none, thin, full]
      enable_susfs:
        description: "Enable SUSFS (managers that support it)"
        type: boolean
        default: true
      enable_ccache:
        description: "Enable ccache / ThinLTO cache"
        type: boolean
        default: true
      create_draft_release:
        description: "Create a draft GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.short }} / ${{ matrix.manager }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        source: [aosp-pablo, clo-marble]
        manager: [kernelsu, kernelsu-next, sukisu-ultra, resukisu]
        include:
          - { source: aosp-pablo, short: aosp }
          - { source: clo-marble, short: clo }
    env:
      SOURCE: ${{ matrix.source }}
      MANAGER: ${{ matrix.manager }}
      SHORT: ${{ matrix.short }}
      ENABLE_SUSFS: ${{ matrix.manager != 'kernelsu' && inputs.enable_susfs }}
      LTO: ${{ inputs.lto }}
      USE_CCACHE: ${{ inputs.enable_ccache }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # each kernel source picks its own toolchain (config/kernel-sources.json)
      - name: Read toolchain for this source
        run: echo "TOOLCHAIN=$(jq -r --arg s "$SOURCE" '.[$s].kernel.toolchain' config/kernel-sources.json)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true

      - name: Swap for LTO
        if: ${{ inputs.lto != 'none' }}
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache cpio curl \
            flex git jq kmod libelf-dev libncurses-dev libssl-dev lld llvm clang file python3 \
            python-is-python3 rsync unzip zip zstd

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchain
          key: toolchain-v1-${{ runner.os }}-${{ env.TOOLCHAIN }}

      - name: Fetch toolchain
        run: bash scripts/toolchain.sh "$TOOLCHAIN"

      - name: Clone source, manager and SUSFS
        run: bash scripts/prepare.sh

      - name: Restore ccache / ThinLTO cache
        id: cc
        if: ${{ inputs.enable_ccache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.ccache
            ~/.cache/thinlto
          key: cc-${{ matrix.short }}-${{ env.TOOLCHAIN }}-${{ inputs.lto }}-${{ github.run_id }}
          restore-keys: cc-${{ matrix.short }}-${{ env.TOOLCHAIN }}-${{ inputs.lto }}-

      - name: Build kernel
        run: bash scripts/build-kernel.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.short }}_${{ matrix.manager }}
          path: dist/${{ matrix.short }}/${{ matrix.manager }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # one cache writer per source (kernelsu leg) keeps us under the 10 GB repo cache limit
      - name: Save ccache / ThinLTO cache
        if: ${{ always() && !cancelled() && inputs.enable_ccache && matrix.manager == 'kernelsu' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.ccache
            ~/.cache/thinlto
          key: cc-${{ matrix.short }}-${{ env.TOOLCHAIN }}-${{ inputs.lto }}-${{ github.run_id }}

  package:
    name: Package combined zip
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*_*"
          path: artifacts

      - name: Build combined zip
        id: pkg
        run: |
          command -v zip >/dev/null || sudo apt-get install -y zip
          bash scripts/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marble-kernel
          path: release/*
          if-no-files-found: error
          compression-level: 0

      - name: Draft release
        if: ${{ inputs.create_draft_release }}
        run: |
          tag="$(date +%Y.%m.%d)"
          gh release create "$tag" release/* --draft --target "$GITHUB_SHA" \
            --title "Marble kernel | $tag" \
            --notes "aosp/ and clo/ kernels (KernelSU, KernelSU-Next, SukiSU Ultra, ReSukiSU). The installer picks the folder from ro.sys.buildtype; choose the variant with the volume keys, confirm with power."
